name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            maven_profile: dev-linux
            platform: linux
            installer_glob: "*.deb"
          - os: windows-latest
            maven_profile: prod-win
            platform: windows
            installer_glob: "*.exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils

      - name: Install Windows packaging tools (WiX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory | Select-Object -First 1
          if (-not $wix) { choco install wixtoolset --version=3.14.1 -y --no-progress }
          if (-not $wix) { throw "WiX Toolset not found after install" }
          Add-Content -Path $env:GITHUB_PATH -Value "$($wix.FullName)\bin"
          Write-Host "Added to PATH: $($wix.FullName)\bin"

      - name: Build installer
        run: mvn -B -P${{ matrix.maven_profile }} -Djava.home="$JAVA_HOME" clean package -DskipTests=false
        shell: bash

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          files=(target/dist/${{ matrix.installer_glob }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer found in target/dist matching ${{ matrix.installer_glob }}"
            ls -la target/dist || true
            exit 1
          fi
          for f in "${files[@]}"; do
            ext="${f##*.}"
            cp "$f" "dist/ReportDesigner-${{ github.ref_name }}-${{ matrix.platform }}.${ext}"
          done
          ls -la dist/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-installer-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
