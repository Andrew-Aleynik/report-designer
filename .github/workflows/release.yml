name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            maven_profile: dev-linux
            platform: linux
          - os: windows-latest
            maven_profile: prod-win
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build package
        run: mvn -B -P${{ matrix.maven_profile }} -Djava.home="$JAVA_HOME" clean package -DskipTests=false
        shell: bash

      - name: Prepare release JAR
        shell: bash
        run: |
          mkdir -p dist
          jar_file=$(ls target/*-jar-with-dependencies.jar | head -n 1)
          cp "$jar_file" "dist/reportdesigner-${{ github.ref_name }}-${{ matrix.platform }}.jar"
          ls -la dist/

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: release-jar-${{ matrix.platform }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          pattern: release-jar-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
