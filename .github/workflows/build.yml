name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            maven_profile: dev-linux
          - os: windows-latest
            maven_profile: prod-win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils

      - name: Install Windows packaging tools (WiX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory | Select-Object -First 1
          if (-not $wix) { choco install wixtoolset --version=3.14.1 -y --no-progress }
          if (-not $wix) { throw "WiX Toolset not found after install" }
          Add-Content -Path $env:GITHUB_PATH -Value "$($wix.FullName)\bin"
          Write-Host "Added to PATH: $($wix.FullName)\bin"

      - name: Build and test
        # Override hardcoded java.home from pom.xml with CI JDK
        # verify runs package → jlink + jpackage (.deb / .exe)
        run: mvn -B -P${{ matrix.maven_profile }} -Djava.home="$JAVA_HOME" clean verify
        shell: bash

      - name: Upload sample report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sample-report-${{ matrix.os }}
          path: target/sample-reports/expert-report.pdf
          if-no-files-found: ignore

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            target/dist/*.deb
            target/dist/*.exe
          if-no-files-found: ignore
